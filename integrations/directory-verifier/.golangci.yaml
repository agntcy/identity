---
# Separate integration module: correctness and security checks for the HTTP adapter.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
formatters:
  enable:
    - gofmt
    - goimports
