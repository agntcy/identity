---
name: Build and Push

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      workdir:
        required: true
        type: string
        description: "Workdir"
      config:
        required: false
        type: string
        description: "Config file"
    secrets:
      github-token:
        description: "Github token"
        required: false
      gpg-private-key:
        description: "GPG private key for signing"
        required: true
      gpg-passphrase:
        description: "GPG passphrase for signing"
        required: true

jobs:
  build-and-release:
    name: Build and Release Go
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@09d2acae674a48949e3602304ab46fd20ae0c42f # v4.2.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restart GPG Agent
        run: |
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent

      - name: Import GPG Key
        run: |
          mkdir -p /tmp/gpg
          echo "${{ secrets.gpg-private-key }}" > /tmp/gpg/private-key.asc
          gpg --batch --yes --pinentry-mode loopback --import /tmp/gpg/private-key.asc
        env:
          GPG_TTY: /dev/tty

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '~> v2'
          workdir: ${{ inputs.workdir }}
          args: release --clean --config ${{ inputs.config }}
          install-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          GPG_PASSPHRASE: ${{ secrets.gpg-passphrase }}

      - name: Locate release checksums
        id: provenance-subjects
        working-directory: ${{ inputs.workdir }}
        env:
          GORELEASER_ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          checksum_file=$(jq -er '
            [.[] | select(.type == "Checksum") | .path]
            | if length == 1 then .[0]
              else error("Expected exactly one GoReleaser checksum artifact")
              end
          ' <<< "$GORELEASER_ARTIFACTS")
          test -s "$checksum_file"
          echo "checksums=$(realpath "$checksum_file")" >> "$GITHUB_OUTPUT"

      - name: Attest release build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.provenance-subjects.outputs.checksums }}

      - name: Publish release provenance
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          # Preserve the signed Sigstore bundle (including its verification material).
          # The action writes JSONL; this extension also makes it discoverable by Scorecard.
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/identity-provenance.intoto.jsonl"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/identity-provenance.intoto.jsonl" --repo "$GITHUB_REPOSITORY"

      - name: Publish release signing public key
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          signing_key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$signing_key"
          gpg --batch --armor --export "$signing_key" > "$RUNNER_TEMP/identity-release-signing-key.asc"
          test -s "$RUNNER_TEMP/identity-release-signing-key.asc"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/identity-release-signing-key.asc" --repo "$GITHUB_REPOSITORY"
