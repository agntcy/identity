---
name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

# Declare default permissions as read-only
permissions: read-all

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This repository is a multi-module workspace with no go.work, so a
        # single run at the root would silently skip three of the four modules.
        module:
          - "."
          - "api/client"
          - "api/spec/plugins/protoc-gen-go-srvreg"
          # scripts/proto/proto-enum-generator is deliberately not gated yet:
          # never having been linted, it has 23 findings, and 5 of them are
          # paralleltest asking for t.Parallel() on tests that mutate shared
          # on-disk fixtures — where adding it would introduce a real race.
          # That module needs a judgement pass of its own, not a blanket fix.
    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@09d2acae674a48949e3602304ab46fd20ae0c42f # v4.2.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: 🧹 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
          # Lint the whole module, not just files changed in the PR, so
          # pre-existing findings cannot hide in untouched packages.
          args: >-
            --config ${{ github.workspace }}/.github/linters/.golangci.yaml
            --timeout 10m
